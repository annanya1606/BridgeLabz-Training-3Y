<!DOCTYPE html>
<html>
<head>
    <title>Team Members</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            margin: 30px;
        }

        .team {
            display: flex;
            gap: 20px;
            margin: 30px;
        }

        .card {
            background-color: white;
            width: 30%;
            padding: 20px;
            margin: 10px;
            border: 2px solid #333;
            border-radius: 10px;
            box-shadow: 3px 3px 10px gray;
            text-align: center;
        }

        .leader {
            background-color: #d6eaff;
            border: 3px solid #0066cc;
        }

        .card h2 {
            margin-bottom: 10px;
        }

    </style>
</head>

<body>

    <h1>Our Team Members</h1>

    <div class="team">

        <div class="card leader">
            <h2>Annanya Jain</h2>
            <h3>Team Lead</h3>
            <p>
                Responsible for managing the team and
                coordinating project activities.
            </p>
        </div>

        <div class="card">
            <h2>Rahul Sharma</h2>
            <h3>Developer</h3>
            <p>
                Works on coding and developing
                features for the project.
            </p>
        </div>

        <div class="card">
            <h2>Priya Singh</h2>
            <h3>Designer</h3>
            <p>
                Creates designs and improves the
                user interface of the project.
            </p>
        </div>

    </div>

</body>
</html>
