<!DOCTYPE html>
<html>
<head>
    <title>Pricing Plans</title>

    <style>
       
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        h1 {
            text-align: center;
            margin: 30px;
        }

        .pricing {
            display: flex;
            justify-content: space-around;
            align-items: stretch;
            gap: 20px;
            margin: 30px;
        }

        .plan {
            background-color: white;
            border: 2px solid #333;
            padding: 25px;
            width: 30%;
            text-align: center;
            transition: 0.3s;
        }

        .plan:hover {
            transform: scale(1.05);
            background-color: #e6f7ff;
        }

        .popular {
            border: 3px solid blue;
            border-style: dashed;
            background-color: #eef5ff;
        }

        .price {
            font-size: 25px;
            font-weight: bold;
        }

        .button {
            display: inline-block;
            background-color: #222;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            margin-top: 15px;
            border-radius: 5px;
        }

        .button:hover {
            background-color: blue;
        }

       
        @media screen and (max-width: 600px) {
            .pricing {
                flex-direction: column;
                align-items: center;
            }

            .plan {
                width: 80%;
            }
        }
    </style>
</head>

<body>

    <h1>Pricing Plans</h1>

    <div class="pricing">

        <!-- Basic Plan -->
        <div class="plan">
            <h2>Basic</h2>

            <ul>
                <li>1 User</li>
                <li>5 GB Storage</li>
                <li>Email Support</li>
            </ul>

            <p class="price">₹199/month</p>

            <a href="#" class="button">Choose Plan</a>
        </div>

        <!-- Standard Plan -->
        <div class="plan popular">
            <h2>Standard</h2>

            <ul>
                <li>5 Users</li>
                <li>20 GB Storage</li>
                <li>Priority Support</li>
            </ul>

            <p class="price">₹399/month</p>

            <a href="#" class="button">Choose Plan</a>
        </div>

        <!-- Premium Plan -->
        <div class="plan">
            <h2>Premium</h2>

            <ul>
                <li>10 Users</li>
                <li>50 GB Storage</li>
                <li>24/7 Support</li>
            </ul>

            <p class="price">₹699/month</p>

            <a href="#" class="button">Choose Plan</a>
        </div>

    </div>

</body>
</html>
