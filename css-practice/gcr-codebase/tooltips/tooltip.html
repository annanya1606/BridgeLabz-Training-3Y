<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            position: relative;
            display: inline-block;
        }
        .tooltip-text{
            visibility: hidden;
            position: absolute;
            background-color: black;
            color: wheat;
            padding: 8px;
        }
        .box:hover .tooltip-text{
            visibility: visible;
        }
    </style>
</head>
<body>
    <div class="box">
        Hover me
        <span class="tooltip-text"> section af</span>
    </div>
</body>
</html>
