<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gradient</title>
    <style>
        .box {
            width: 300px;
            height: 150px;
            background: radial-gradient(closest-side,
                    violet,
                    indigo,
                    blue,
                    green,
                    yellow,
                    red);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;

        }
    </style>
</head>

<body>
    <div class="box">
        Hotstar
    </div>
</body>

</html>
