<!DOCTYPE html>
<html>
<head>
    <title>Contact Page</title>

    <style>
        /* Basic page styling */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            color: #333;

            /* Center form vertically and horizontally */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Form styling */
        form {
            background-color: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 3px 10px gray;
        }

        h1 {
            text-align: center;
        }

        /* Input fields */
        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid gray;
            border-radius: 5px;
            box-shadow: 0 1px 3px lightgray;
        }

        /* Change border color when focused */
        input:focus,
        textarea:focus {
            border-color: blue;
            outline: none;
        }

        /* Button */
        button {
            background-color: #333;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            width: 100%;
        }
    </style>
</head>

<body>

    <form>
        <h1>Contact Us</h1>

        <label>Name:</label>
        <input type="text" placeholder="Enter your name">

        <label>Email:</label>
        <input type="email" placeholder="Enter your email">

        <label>Subject:</label>
        <input type="text" placeholder="Enter subject">

        <label>Message:</label>
        <textarea rows="5" placeholder="Enter your message"></textarea>

        <button type="submit">Send Message</button>
    </form>

</body>
</html>
