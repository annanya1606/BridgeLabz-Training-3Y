<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background-color: #f2f2f2;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 4fr;
            grid-template-rows: 80px 1fr;
            gap: 20px;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            grid-column: span 2;
            background-color: #222;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar {
            background-color: #333;
            padding: 30px 20px;
        }

        .sidebar h2 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px;
            margin-bottom: 10px;
            background-color: #444;
            border-radius: 5px;
        }

        .sidebar a:hover {
            background-color: #555;
        }

        .content {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .box {
            background-color: white;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: 10px;
            transition: 0.3s;
        }

        .box h2 {
            margin-bottom: 10px;
        }

        .box:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px gray;
        }

        .box1 {
            grid-column: span 2;
        }

        @media (max-width: 700px) {

            .dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }

            header {
                grid-column: span 1;
            }

            .content {
                grid-template-columns: 1fr;
            }

            .box1 {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <header>
            <h1>Dashboard</h1>
        </header>

        <aside class="sidebar">
            <h2>Menu</h2>

            <a href="#">Home</a>
            <a href="#">Profile</a>
            <a href="#">Settings</a>
            <a href="#">Logout</a>
        </aside>

        <main class="content">

            <div class="box box1">
                <h2>Total Sales</h2>
                <p>₹50,000</p>
            </div>

            <div class="box">
                <h2>Products</h2>
                <p>120 Products</p>
            </div>

            <div class="box">
                <h2>Customers</h2>
                <p>250 Customers</p>
            </div>

            <div class="box">
                <h2>Orders</h2>
                <p>180 Orders</p>
            </div>

        </main>

    </div>

</body>

</html>
