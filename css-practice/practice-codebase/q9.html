<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f2f2f2;
            perspective: 1000px;
        }

        .card-container {
            width: 300px;
            height: 400px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s;
        }

        .card-container:hover .card {
            transform: rotateY(180deg);
        }

        .front,
        .back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 10px;
            overflow: hidden;
        }

        .front {
            background-color: white;
            text-align: center;
        }

        .front img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }

        .front h2 {
            padding: 20px;
        }

        .back {
            background-color: #222;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
            transform: rotateY(180deg);
        }
    </style>
</head>

<body>

    <div class="card-container">

        <div class="card">

            <div class="front">
                <img src="https://picsum.photos/300/280" alt="Nature">
                <h2>Beautiful Nature</h2>
            </div>

            <div class="back">
                <p>
                    Nature provides us with beautiful landscapes,
                    fresh air and a peaceful environment. It is
                    important to protect and preserve nature.
                </p>
            </div>

        </div>

    </div>

</body>

</html>
