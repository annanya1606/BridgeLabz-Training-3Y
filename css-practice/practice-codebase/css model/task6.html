 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations Showcase</title>
    <link rel="stylesheet" href="task6.css">
</head>
<body>

    <header>
        <h1>CSS Transformations Showcase</h1>
        <p>Hover over each box to see the transformation.</p>
    </header>

    <main>
        <section class="transform-container">

            <div class="transform-item">
                <div class="box rotate">Rotate</div>
                <p>rotate(45deg)</p>
            </div>

            <div class="transform-item">
                <div class="box scale">Scale</div>
                <p>scale(1.2)</p>
            </div>

            <div class="transform-item">
                <div class="box translate">Translate</div>
                <p>translate(20px, -20px)</p>
            </div>

            <div class="transform-item">
                <div class="box skew">Skew</div>
                <p>skew(15deg)</p>
            </div>

        </section>
    </main>

    <footer>
        <p>CSS Transformations Practice</p>
    </footer>

</body>
</html>
