
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline and Focus Styling Form</title>
    <link rel="stylesheet" href="task9.css">
</head>
<body>

    <header>
        <h1>Contact Us</h1>
        <p>Outline and Focus Styling Demonstration</p>
    </header>

    <main>
        <form class="contact-form">
            <h2>Contact Form</h2>

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter your phone number">

            <label for="message">Your Message</label>
            <textarea id="message" rows="4" placeholder="Write your message"></textarea>

            <button type="submit">Submit</button>
        </form>
    </main>

    <footer>
        <p>CSS Outline and Focus Practice</p>
    </footer>

</body>
</html>
