<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding Demonstration</title>

    <link rel="stylesheet" href="task1.css">
</head>
<body>

    <header>
        <h1>Borders and Padding Demonstration</h1>
        <p>Different border styles, rounded corners and padding values</p>
    </header>

    <main>
        <section class="box-container">

            <div class="box solid">
                <h2>Solid Border</h2>
                <p>Padding: 10px</p>
            </div>

            
            <div class="box dashed">
                <h2>Dashed Border</h2>
                <p>Padding: 20px</p>
            </div>
            <div class="box double">
                <h2>Double Border</h2>
                <p>Padding: 15px</p>
            </div>

            <div class="box groove">
                <h2>Groove Border</h2>
                <p>Padding: 25px</p>
            </div>

        </section>
    </main>
    <footer>
        <p>HTML and CSS Assignment 7</p>
    </footer>

</body>
</html>
