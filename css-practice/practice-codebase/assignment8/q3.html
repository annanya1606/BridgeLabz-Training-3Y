<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Cards with Media Queries</title>

    <style>
        /* Basic styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* Header */
        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        /* Card container */
        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 30px;
        }

        /* Cards */
        .card {
            width: calc(25% - 15px);
            background-color: white;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px #aaa;
            transition: background-color 0.3s ease;
        }

        /* Hover effect */
        .card:hover {
            background-color: #d9f0ff;
        }

        .card h2 {
            margin-bottom: 15px;
        }

        .card p {
            line-height: 1.5;
        }

        /* Tablet - 2 columns */
        @media (max-width: 900px) {
            .card {
                width: calc(50% - 10px);
            }
        }

        /* Mobile - 1 column */
        @media (max-width: 600px) {
            .card {
                width: 100%;
            }

            .card-container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Our Features</h1>
    </header>

    <main>
        <section class="card-container">

            <article class="card">
                <h2>Web Design</h2>
                <p>
                    Create attractive and responsive
                    websites using HTML and CSS.
                </p>
            </article>

            <article class="card">
                <h2>Development</h2>
                <p>
                    Build useful and user-friendly
                    web applications.
                </p>
            </article>

            <article class="card">
                <h2>Data Science</h2>
                <p>
                    Analyze data and find useful
                    information from datasets.
                </p>
            </article>

            <article class="card">
                <h2>AI & ML</h2>
                <p>
                    Learn how artificial intelligence
                    and machine learning work.
                </p>
            </article>

        </section>
    </main>

</body>

</html>
