<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>

    <style>
        /* Basic styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            color: #222;
        }

        /* Header */
        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        /* Comparison container */
        .comparison {
            display: flex;
            gap: 25px;
            justify-content: center;
            padding: 50px 30px;
            max-width: 1000px;
            margin: auto;
        }

        /* Image boxes */
        .image-box {
            flex: 1;
            background-color: white;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px #aaa;
        }

        .image-box img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 5px;
        }

        /* Filter on right image */
        .filtered-image {
            filter: brightness(150%);
            transition: filter 0.6s ease;
        }

        /* Remove filter on hover */
        .filtered-image:hover {
            filter: none;
        }

        /* Captions */
        figcaption {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
        }

        /* Stack images below 700px */
        @media (max-width: 700px) {
            .comparison {
                flex-direction: column;
                padding: 30px 20px;
            }

            .image-box img {
                height: 250px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Filter Comparison</h1>
    </header>

    <main>
        <section class="comparison">

            <!-- Before image -->
            <figure class="image-box">
                <img src="https://picsum.photos/id/1015/600/400"
                    alt="Original image">

                <figcaption>Before - Original</figcaption>
            </figure>

            <!-- After image -->
            <figure class="image-box">
                <img class="filtered-image"
                    src="https://picsum.photos/id/1015/600/400"
                    alt="Filtered image">

                <figcaption>After - Brightness Filter</figcaption>
            </figure>

        </section>
    </main>

</body>

</html>
