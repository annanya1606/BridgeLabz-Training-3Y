<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Web Design Layout</title>

    <style>
        /* Basic styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: #222;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Main area */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .features {
            display: flex;
            gap: 25px;
            width: 100%;
            max-width: 1000px;
        }

        /* Feature boxes */
        .box {
            flex: 1;
            background-color: white;
            padding: 35px 25px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px #aaa;
            transition: transform 0.3s ease;
        }

        .box:hover {
            transform: scale(1.05);
        }

        .box h2 {
            margin-bottom: 15px;
        }

        .box p {
            line-height: 1.5;
        }

        /* Footer */
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Stack boxes below 750px */
        @media (max-width: 750px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            .features {
                flex-direction: column;
            }

            main {
                padding: 30px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">MyWebsite</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <section class="features">

            <div class="box">
                <h2>Web Design</h2>
                <p>
                    Create simple and attractive websites
                    using HTML and CSS.
                </p>
            </div>

            <div class="box">
                <h2>Development</h2>
                <p>
                    Build responsive and user-friendly
                    web applications.
                </p>
            </div>

            <div class="box">
                <h2>Support</h2>
                <p>
                    Get helpful support and solutions
                    for your website.
                </p>
            </div>

        </section>
    </main>

    <footer>
        <p>© 2026 MyWebsite. All Rights Reserved.</p>
    </footer>

</body>

</html>
