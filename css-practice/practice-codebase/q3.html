<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f2f2f2;
        }

        header {
            background-color: #222;
            padding: 20px;
        }

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        nav a:hover {
            color: lightgray;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 30px;
            padding: 50px;
        }

        .box {
            background-color: white;
            width: 30%;
            min-height: 200px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: 10px;
            transition: 0.3s;
        }

        .box h2 {
            margin-bottom: 15px;
        }

        .box:hover {
            transform: rotate(2deg);
        }

        footer {
            width: 100%;
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px;
        }

        @media (max-width: 700px) {

            main {
                flex-direction: column;
                padding: 30px;
            }

            .box {
                width: 90%;
            }

            nav {
                flex-wrap: wrap;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>

        <div class="box">
            <h2>Services</h2>
            <p>We provide useful and reliable services.</p>
        </div>

        <div class="box">
            <h2>Projects</h2>
            <p>Explore our latest projects and work.</p>
        </div>

        <div class="box">
            <h2>Contact</h2>
            <p>Get in touch with us for more information.</p>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 My Homepage. All Rights Reserved.</p>
    </footer>

</body>

</html>
