<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fashion Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css&quot;
        rel=" stylesheet">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                Fashion Store
            </a>
        </div>
    </nav>

    <div id="fashionCarousel" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-indicators">

            <button type="button" data-bs-target="#fashionCarousel" data-bs-slide-to="0" class="active">
            </button>

            <button type="button" data-bs-target="#fashionCarousel" data-bs-slide-to="1">
            </button>

            <button type="button" data-bs-target="#fashionCarousel" data-bs-slide-to="2">
            </button>

        </div>

        <div class="carousel-inner">

            <div class="carousel-item active">

                <img src="https://picsum.photos/id/1011/1200/500&quot;
                    class=" d-block w-100" alt="Fashion">

                <div class="carousel-caption">

                    <h2>Summer Collection</h2>

                    <p>
                        Get up to 50% OFF
                    </p>

                    <button class="btn btn-primary">
                        Shop Now
                    </button>

                </div>

            </div>

            <div class="carousel-item">

                <img src="https://picsum.photos/id/1012/1200/500&quot;
                    class=" d-block w-100 alt="New Collection">

                <div class="carousel-caption">

                    <h2>New Collection</h2>

                    <p>
                        Explore the latest styles
                    </p>

                    <button class="btn btn-success">
                        Explore
                    </button>

                </div>

            </div>

            <div class="carousel-item">

                <img src="https://picsum.photos/id/1015/1200/500&quot;
                    class=" d-block w-100 alt="Special Offer">

                <div class="carousel-caption">

                    <h2>Special Offer</h2>

                    <p>
                        Extra 20% OFF on selected items
                    </p>

                    <button class="btn btn-danger">
                        Buy Now
                    </button>

                </div>

            </div>

        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#fashionCarousel" data-bs-slide="prev">

            <span class="carousel-control-prev-icon"></span>

        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#fashionCarousel" data-bs-slide="next">

            <span class="carousel-control-next-icon"></span>

        </button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> </script>

</body >

</html >
