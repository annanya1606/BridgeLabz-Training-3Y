<!DOCTYPE html>
<html>
<head>
    <title>Frameset Layout</title>
</head>

<frameset rows="30%,70%">

    <frame srcdoc="
        <html>
        <body>
            <h2>My Website</h2>
            <a href='#'>Home</a> |
            <a href='#'>About</a> |
            <a href='#'>Contact</a>
        </body>
        </html>
    " title="Navigation">

    <frame srcdoc="
        <html>
        <body>
            <h1>Welcome to My Website</h1>
        </body>
        </html>
    " title="Welcome Message">

</frameset>
</html>
