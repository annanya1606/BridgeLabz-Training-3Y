<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Collection</title>
    <style>
        
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f3f3f3;
}

header {
    text-align: center;
    padding: 25px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 50px;
}

button {
    padding: 12px 25px;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.primary {
    background-color: #1769aa;
    color: white;
    border: 2px solid #1769aa;
}

.primary:hover {
    background-color: #0d4f80;
}

.secondary {
    background-color: #555;
    color: white;
    border: 2px solid #555;
}

.secondary:hover {
    background-color: #333;
}

.outline {
    background-color: white;
    color: #1769aa;
    border: 2px solid #1769aa;
}

.outline:hover {
    background-color: #1769aa;
    color: white;
}

button:active {
    transform: scale(0.95);
}

button:focus {
    outline: 3px solid #f0c000;
}

button:disabled {
    background-color: #ccc;
    color: #777;
    border-color: #ccc;
    cursor: not-allowed;
    box-shadow: none;
}


    </style>
</head>
<body>

<header>
    <h1>Button Collection</h1>
</header>

<main>
    <section class="buttons">

        <button class="primary">Primary</button>

        <button class="secondary">Secondary</button>

        <button class="outline">Outline</button>

        <button class="disabled" disabled>Disabled</button>

    </section>
</main>

</body>
</html>
