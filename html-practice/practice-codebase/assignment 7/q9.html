<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined CSS Effects</title>
    <style>
       
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
}

header {
    text-align: center;
    padding: 30px;
}

.effects {
    display: flex;
    justify-content: center;
    gap: 25px;
    padding: 60px 20px;
}

.effect {
    padding: 15px 25px;
    border: none;
    border-radius: 7px;
    color: white;
    cursor: pointer;
    box-shadow: 0 3px 7px #bbb;
    transition: all 0.3s ease;
}

.effect:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 12px #999;
}

.effect:active {
    transform: scale(0.95);
}

.blue {
    background-color: #1769aa;
}

.blue:hover {
    background-color: #0d4f80;
}

.green {
    background-color: #398439;
}

.green:hover {
    background-color: #256425;
}

.orange {
    background-color: #e67e22;
}

.orange:hover {
    background-color: #c45d0a;
}

.purple {
    background-color: #7b4aa8;
}

.purple:hover {
    background-color: #5a337c;
}

.effect:focus {
    outline: 3px solid #f1c40f;
}


    </style>
</head>
<body>

<header>
    <h1>Combined CSS Effects</h1>
</header>

<main>
    <section class="effects">

        <button class="effect blue">Hover Me</button>

        <button class="effect green">Move Me</button>

        <button class="effect orange">Click Me</button>

        <button class="effect purple">Try Me</button>

    </section>
</main>

</body>
</html>
