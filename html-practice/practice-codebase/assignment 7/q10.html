<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <style>
       
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    color: #333;
}

header {
    background-color: #333;
    color: white;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav {
    display: flex;
    gap: 20px;
}

nav a {
    color: white;
    text-decoration: none;
}

nav a:hover {
    color: #ffd700;
}

main {
    min-height: 500px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.main-card {
    max-width: 800px;
    width: 100%;
    background-color: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 30px;
    box-shadow: 0 4px 12px #ccc;
    display: flex;
    gap: 40px;
}

.content {
    flex: 1;
}

form {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

input {
    padding: 11px;
    border: 1px solid #aaa;
    border-radius: 5px;
}

input:focus {
    outline: 2px solid #1769aa;
}

button {
    padding: 11px;
    border: none;
    border-radius: 5px;
    background-color: #1769aa;
    color: white;
    cursor: pointer;
    margin-top: 5px;
}

button:hover {
    background-color: #0d4f80;
}

.reset {
    background-color: #777;
}

.reset:hover {
    background-color: #555;
}

.image {
    display: flex;
    align-items: center;
}

.image img {
    width: 250px;
    border-radius: 8px;
}

footer {
    text-align: center;
    background-color: #333;
    color: white;
    padding: 15px;
}

@media (max-width: 700px) {
    header {
        flex-direction: column;
        gap: 15px;
    }

    .main-card {
        flex-direction: column;
    }

    .image {
        justify-content: center;
    }

    .image img {
        width: 100%;
        max-width: 300px;
    }
}


    </style>
</head>
<body>

<header>
    <h1>My Mini Website</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<main>
    <section class="main-card">

        <div class="content">
            <h2>Welcome!</h2>
            <p>Fill the form below to get started.</p>

            <form>
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">

                <button type="submit">Submit</button>
                <button type="reset" class="reset">Reset</button>
            </form>
        </div>

        <div class="image">
            <img src="https://picsum.photos/id/1062/300/300" alt="Nature image">
        </div>

    </section>
</main>

<footer>
    <p>© 2026 My Mini Website</p>
</footer>

</body>
</html>
