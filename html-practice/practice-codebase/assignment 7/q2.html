<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demo</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

<header>
    <h1>Tooltip Demo</h1>
</header>

<main>
    <section class="tooltip-container">

        <div class="item">
            <span>Home</span>
            <div class="tooltip">Go to Home</div>
        </div>

        <div class="item">
            <span>Search</span>
            <div class="tooltip">Search something</div>
        </div>

        <div class="item">
            <span>Profile</span>
            <div class="tooltip">View your profile</div>
        </div>

        <div class="item">
            <span>Settings</span>
            <div class="tooltip">Open Settings</div>
        </div>

    </section>
</main>

</body>
</html>
