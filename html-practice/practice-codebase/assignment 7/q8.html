<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing</title>
    <style>
        
* {
    margin: 0;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
}

header {
    text-align: center;
    padding: 30px;
}

.comparison {
    display: flex;
    justify-content: center;
    gap: 30px;
    padding: 40px;
}

.box {
    width: 300px;
    padding: 30px;
    border: 8px solid #333;
    border-radius: 8px;
}

.default-box {
    box-sizing: content-box;
    background-color: #ffdede;
}

.border-box {
    box-sizing: border-box;
    background-color: #dfeeff;
}

@media (max-width: 700px) {
    .comparison {
        flex-direction: column;
        align-items: center;
    }
}


    </style>
</head>
<body>

<header>
    <h1>Box-Sizing Comparison</h1>
</header>

<main>
    <section class="comparison">

        <div class="box default-box">
            <h2>Default</h2>
            <p>box-sizing: content-box</p>
            <p>Padding and border are added to the given width.</p>
        </div>

        <div class="box border-box">
            <h2>Border Box</h2>
            <p>box-sizing: border-box</p>
            <p>Padding and border are included inside the given width.</p>
        </div>

    </section>
</main>

</body>
</html>
