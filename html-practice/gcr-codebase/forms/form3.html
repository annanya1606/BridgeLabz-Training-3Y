<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input types</title>
</head>

<body bgcolor="lightpink">
    <form>
        <label for="radio1">Male</label>
        <input type="radio" name="gender" id="radio1" />
        <label for="radio2">Female</label>
        <input type="radio" name="gender" id="radio2" />
        <label for="radio3">Other</label>
        <input type="radio" name="gender" id="radio3" />
        <br />
        <br />
        <label for="checkbox1">English</label>
        <input type="checkbox" name="Language" id="checkbox1" />
        <label for="checkbox2">Hindi</label>
        <input type="checkbox" name="Language" id="checkbox2" />
        <label for="checkbox3">Tamil</label>
        <input type="checkbox" name="Language" id="checkbox3" />
        <br />
        <br />
        <label for="file">Upload file</label>
        <input type="file" id="file" name="file" />
        <br />
        <br />

        <input type="image" name="image" id="images"
            src="https://www.bu.edu/files/2024/08/Hey-BU-Blog-Headers.jpg"
            height="300" width="300" />
        <br />
        <br />
        <label for="password">Enter password</label>
        <input type="password" name="password" id="password" />
        <br />
        <br />
        <label for="datepicker">Select date</label>
        <input type="date" name="datepicker" id="datepicker" />

    </form>
</body>

</html>
