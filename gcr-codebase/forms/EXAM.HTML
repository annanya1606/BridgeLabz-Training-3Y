<!DOCTYPE html>
<html>
<head>
    <title>University Portal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
        }

        header {
            height: 32px;
            width: 100%;
            background: #4169b1;
            color: white;
            display: flex;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
        }

        .close {
            width: 40px;
            font-size: 20px;
            padding-left: 10px;
        }

        .logo {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: bold;
        }

        nav {
            margin-left: auto;
            margin-right: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 9px;
            margin-left: 15px;
        }

        /* Sidebar */
        aside {
            position: fixed;
            top: 32px;
            left: 0;
            width: 140px;
            height: 188px;
            background: #4169b1;
        }

        aside a {
            display: block;
            color: white;
            text-decoration: none;
            font-size: 9px;
            padding: 12px 8px;
            border-bottom: 1px solid #6687c4;
        }

        /* Main content */
        main {
            margin-left: 140px;
            padding: 60px 10px;
        }

        main h2 {
            color: #4169b1;
            font-size: 14px;
            margin-bottom: 10px;
        }

        main p {
            color: #999;
            font-size: 8px;
        }

        /* Responsive */
        @media screen and (max-width: 600px) {

            aside {
                left: -140px;
                transition: 0.4s;
            }

            main {
                margin-left: 0;
            }

            nav {
                display: none;
            }
        }
    </style>
</head>

<body>

    <header>

        <div class="close">
            X
        </div>

        <div class="logo">
            University Portal
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Courses</a>
            <a href="#">Profile</a>
        </nav>

    </header>

    <aside>

        <a href="#">Dashboard</a>
        <a href="#">Courses</a>
        <a href="#">Settings</a>
        <a href="#">Logout</a>

    </aside>

    <main>

        <h2>Welcome to the University Dashboard</h2>

        <p>
            This is your main content area. Resize the window or use the
            hamburger icon to see the responsive behavior.
        </p>

    </main>

</body>
</html>
