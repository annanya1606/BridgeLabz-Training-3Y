
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="Task-Tracker.css">
</head>
<body>

<header class="bg-primary text-white text-center p-4">
<h1>My Task Tracker</h1>
<p>Pending Tasks <span class="badge bg-danger">3</span></p>
</header>

<main class="container my-5">
<section class="row justify-content-center">
<div class="col-md-8">

<h2 class="mb-3">Today's Tasks</h2>

<!-- list-group displays tasks in a neat vertical list -->
<ul class="list-group">
<li class="list-group-item d-flex justify-content-between align-items-center">
Complete Assignment
<span class="badge bg-danger">High</span>
</li>

<li class="list-group-item d-flex justify-content-between align-items-center">
Study Bootstrap
<span class="badge bg-warning text-dark">Medium</span>
</li>

<li class="list-group-item d-flex justify-content-between align-items-center">
Read a Book
<span class="badge bg-success">Low</span>
</li>
</ul>

<div class="text-center mt-4">
<button class="btn btn-success">Completed <span class="badge bg-light text-dark">1</span></button>
</div>

</div>
</section>
</main>

<footer class="bg-dark text-white text-center p-3">
© 2026 Task Tracker
</footer>

</body>
</html>
