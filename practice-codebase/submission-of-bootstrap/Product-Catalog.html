
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Store</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="Product-Catalog.css">
</head>
<body>

<header class="bg-primary text-white text-center p-4">
<h1>My Product Store</h1>
</header>

<main class="container my-5">
<h2 class="text-center mb-4">Our Products</h2>

<!-- Bootstrap grid: 4 columns on desktop, 2 on tablets, 1 on mobile -->
<div class="row g-4">

<div class="col-12 col-sm-6 col-md-3">
<div class="card product shadow-sm">
<img src="https://via.placeholder.com/250" class="card-img-top" alt="Headphones">
<div class="card-body text-center">
<h5>Headphones</h5>
<p>₹999</p>
<button class="btn btn-primary">Add to Cart</button>
</div>
</div>
</div>

<div class="col-12 col-sm-6 col-md-3">
<div class="card product shadow-sm">
<img src="https://via.placeholder.com/250" class="card-img-top" alt="Smart Watch">
<div class="card-body text-center">
<h5>Smart Watch</h5>
<p>₹1499</p>
<button class="btn btn-primary">Add to Cart</button>
</div>
</div>
</div>

<div class="col-12 col-sm-6 col-md-3">
<div class="card product shadow-sm">
<img src="https://via.placeholder.com/250" class="card-img-top" alt="Camera">
<div class="card-body text-center">
<h5>Camera</h5>
<p>₹2999</p>
<button class="btn btn-primary">Add to Cart</button>
</div>
</div>
</div>

<div class="col-12 col-sm-6 col-md-3">
<div class="card product shadow-sm">
<img src="https://via.placeholder.com/250" class="card-img-top" alt="Speaker">
<div class="card-body text-center">
<h5>Speaker</h5>
<p>₹799</p>
<button class="btn btn-primary">Add to Cart</button>
</div>
</div>
</div>

</div>
</main>

<footer class="bg-dark text-white text-center p-3">
© 2026 Product Store
</footer>

</body>
</html>
