
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog Pagination</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="Blog-Pagination-&-Pager.css">
</head>
<body>

<header class="bg-dark text-white text-center p-4">
<h1>My Blog Posts</h1>
</header>

<main class="container my-5">
<section class="mb-5">
<h2>Latest Articles</h2>

<article class="card p-3 mb-3">
<h4>Learning Web Development</h4>
<p>Explore HTML, CSS and Bootstrap to create modern websites.</p>
</article>

<article class="card p-3">
<h4>Benefits of Technology</h4>
<p>Technology makes our daily life easier and smarter.</p>
</article>
</section>

<!-- pagination component for page navigation -->
<nav aria-label="Blog pages">
<ul class="pagination justify-content-center">
<li class="page-item"><a class="page-link" href="#">Previous</a></li>
<li class="page-item active"><a class="page-link" href="#">1</a></li>
<li class="page-item"><a class="page-link" href="#">2</a></li>
<li class="page-item"><a class="page-link" href="#">Next</a></li>
</ul>
</nav>

<div class="d-flex justify-content-between mt-4">
<a href="#" class="btn btn-outline-secondary">Newer Posts</a>
<a href="#" class="btn btn-outline-secondary">Older Posts</a>
</div>
</main>

<footer class="bg-dark text-white text-center p-3">
© 2026 My Blog
</footer>

</body>
</html>
