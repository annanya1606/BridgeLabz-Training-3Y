
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="Notification-Dashboard.css">
</head>
<body>

<header class="bg-dark text-white text-center p-4">
<h1>Notifications Dashboard</h1>
</header>

<main class="container my-5">
<div class="row justify-content-center">
<div class="col-md-8">

<section class="card shadow p-4">
<h2 class="mb-4">Your Notifications</h2>

<div class="alert alert-success">You have received a new message!</div>
<div class="alert alert-info">Tip: Update your profile regularly.</div>
<div class="alert alert-danger">Warning: Your password expires soon.</div>

<!-- alert-dismissible allows the user to close this alert -->
<div class="alert alert-warning alert-dismissible fade show">
Remember to check your account details.
<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<section class="bg-light border rounded p-4 mt-3">
<h3>Summary</h3>
<p>Total Notifications: 4</p>
<p>Unread Notifications: 2</p>
</section>

</section>
</div>
</div>
</main>

<footer class="bg-dark text-white text-center p-3">
© 2026 Dashboard
</footer>

<!-- Bootstrap JavaScript is required for dismissible alerts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
