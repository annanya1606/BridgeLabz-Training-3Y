
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurant Menu</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="Restaurant-Menu.css">
</head>
<body>

<header class="bg-dark text-white text-center p-4">
<h1>Food Paradise</h1>
</header>

<main class="container my-5">
<section>
<h2 class="text-center">Today's Menu</h2>
<p class="lead text-center">Fresh and delicious food for everyone.</p>

<!-- table-responsive prevents horizontal overflow on small screens -->
<div class="table-responsive">
<table class="table table-bordered table-striped text-center">
<thead>
<tr><th>Item</th><th>Category</th><th>Price</th></tr>
</thead>
<tbody>
<tr><td>Pizza</td><td>Main Course</td><td>₹250</td></tr>
<tr><td>Burger</td><td>Fast Food</td><td>₹120</td></tr>
<tr><td>Pasta</td><td>Main Course</td><td>₹180</td></tr>
<tr><td>Ice Cream</td><td>Dessert</td><td>₹80</td></tr>
</tbody>
</table>
</div>
</section>

<section class="row mt-4">
<div class="col-md-6">
<h3>Chef's Specials</h3>
<ul class="list-group">
<li class="list-group-item">Special Paneer</li>
<li class="list-group-item">Cheese Pizza</li>
<li class="list-group-item">Chocolate Brownie</li>
</ul>
</div>

<div class="col-md-6 text-center mt-3">
<figure>
<img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600" class="img-fluid rounded" alt="Pizza">
<figcaption class="mt-2">Delicious freshly baked pizza</figcaption>
</figure>
</div>
</section>
</main>

<footer class="bg-dark text-white text-center p-3">
Visit Food Paradise Today!
</footer>

</body>
</html>
