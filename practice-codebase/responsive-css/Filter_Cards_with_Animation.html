
<!DOCTYPE html>
<html>
<head>
    <title>Filter Cards Animation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial;
            background: #eee;
            text-align: center;
        }

        .cards {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .card {
            background: white;
            padding: 15px;
            flex: 1;
            animation: fade 1s;
            transition: 0.3s;
        }

        img {
            width: 100%;
            height: 180px;
            filter: grayscale(100%);
            transition: 0.4s;
        }

        img:hover {
            filter: none;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        @keyframes fade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media(max-width: 800px) {
            .cards {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <h1>Our Profiles</h1>

    <main class="cards">
        <section class="card">
            <img src="https://picsum.photos/300/200?7" alt="Profile 1">
            <h2>Riya</h2>
            <p>Designer</p>
        </section>

        <section class="card">
            <img src="https://picsum.photos/300/200?8" alt="Profile 2">
            <h2>Rahul</h2>
            <p>Developer</p>
        </section>

        <section class="card">
            <img src="https://picsum.photos/300/200?9" alt="Profile 3">
            <h2>Priya</h2>
            <p>Photographer</p>
        </section>
    </main>

</body>
</html>
