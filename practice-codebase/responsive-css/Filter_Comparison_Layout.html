
<!DOCTYPE html>
<html>
<head>
    <title>Filter Comparison</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial;
            background: #eee;
            text-align: center;
        }

        .comparison {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        figure {
            flex: 1;
            background: white;
            padding: 15px;
        }

        img {
            width: 100%;
            height: 250px;
        }

        .after {
            filter: brightness(50%);
            transition: 0.5s;
        }

        .after:hover {
            filter: none;
        }

        @media(max-width: 700px) {
            .comparison {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <h1>Before and After Comparison</h1>

    <main class="comparison">
        <figure>
            <img src="https://picsum.photos/400/250" alt="Original image">
            <figcaption>Before - Original Image</figcaption>
        </figure>

        <figure>
            <img class="after" src="https://picsum.photos/400/250" alt="Filtered image">
            <figcaption>After - Filtered Image</figcaption>
        </figure>
    </main>

</body>
</html>
