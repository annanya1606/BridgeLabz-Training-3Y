
<!DOCTYPE html>
<html>
<head>
    <title>Responsive Typography</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial;
            background: #eee;
        }

        section {
            text-align: center;
            padding: 40px;
            margin: 30px;
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 3rem);
        }

        p {
            font-size: clamp(1rem, 2vw, 1.5rem);
        }

        @media(max-width: 700px) {
            section {
                padding: 20px;
                margin: 10px;
            }

            p {
                line-height: 1.8;
            }
        }
    </style>
</head>
<body>

    <main>
        <section>
            <h1>Responsive Typography</h1>
            <p>
                Responsive typography helps text adjust
                according to different screen sizes.
                It makes websites easy to read on all devices.
            </p>
        </section>
    </main>

</body>
</html>
