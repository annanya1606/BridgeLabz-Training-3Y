
<!DOCTYPE html>
<html>
<head>
    <title>Image Filter Gallery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #eee;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        img {
            width: 100%;
            height: 180px;
            transition: 0.5s;
        }

        .blur { filter: blur(3px); }
        .gray { filter: grayscale(100%); }
        .sepia { filter: sepia(100%); }
        .bright { filter: brightness(50%); }
        .contrast { filter: contrast(200%); }
        .hue { filter: hue-rotate(120deg); }

        img:hover {
            filter: none;
        }

        figure {
            background: white;
            padding: 10px;
        }

        @media(max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <h1>Image Filter Gallery</h1>

    <section class="gallery">
        <figure>
            <img class="blur" src="https://picsum.photos/300/200?1" alt="Nature">
            <figcaption>Blur</figcaption>
        </figure>

        <figure>
            <img class="gray" src="https://picsum.photos/300/200?2" alt="Mountain">
            <figcaption>Grayscale</figcaption>
        </figure>

        <figure>
            <img class="sepia" src="https://picsum.photos/300/200?3" alt="Forest">
            <figcaption>Sepia</figcaption>
        </figure>

        <figure>
            <img class="bright" src="https://picsum.photos/300/200?4" alt="Flowers">
            <figcaption>Brightness</figcaption>
        </figure>

        <figure>
            <img class="contrast" src="https://picsum.photos/300/200?5" alt="Beach">
            <figcaption>Contrast</figcaption>
        </figure>

        <figure>
            <img class="hue" src="https://picsum.photos/300/200?6" alt="Sky">
            <figcaption>Hue Rotate</figcaption>
        </figure>
    </section>

</body>
</html>
